          package com.example.castshare

          import android.app.*
          import android.content.ContentValues
          import android.content.Context
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.net.wifi.WifiManager
          import android.os.Build
          import android.os.IBinder
          import android.provider.MediaStore
          import android.provider.Settings
          import java.io.*
          import java.net.*

          class ReceiverService : Service() {
              @Volatile private var running = false
              private var tcp: ServerSocket? = null
              private var udp: DatagramSocket? = null
              private var lock: WifiManager.MulticastLock? = null

              override fun onBind(i: Intent?): IBinder? = null

              override fun onStartCommand(i: Intent?, f: Int, id: Int): Int {
                  if (i?.action == "STOP") { shutdown(); stopSelf(); return START_NOT_STICKY }
                  if (!running) {
                      running = true
                      val nm = getSystemService(NotificationManager::class.java)
                      nm.createNotificationChannel(NotificationChannel("svc", "Receiver", NotificationManager.IMPORTANCE_LOW))
                      val n = Notification.Builder(this, "svc").setSmallIcon(android.R.drawable.stat_sys_download)
                          .setContentTitle("CastShare is receiving").setContentText("Ready for screens and files").build()
                      startForeground(1, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_DATA_SYNC)
                      val wm = applicationContext.getSystemService(Context.WIFI_SERVICE) as WifiManager
                      lock = wm.createMulticastLock("castshare")
                      lock?.acquire()
                      Thread { udpLoop() }.start()
                      Thread { tcpLoop() }.start()
                  }
                  return START_STICKY
              }

              override fun onDestroy() { shutdown() }

              private fun shutdown() {
                  running = false
                  try { tcp?.close() } catch (e: Exception) {}
                  try { udp?.close() } catch (e: Exception) {}
                  try { lock?.release() } catch (e: Exception) {}
              }

              private fun udpLoop() {
                  try {
                      val s = DatagramSocket(null)
                      s.reuseAddress = true
                      s.bind(InetSocketAddress(45454))
                      udp = s
                      val name = Settings.Global.getString(contentResolver, "device_name") ?: Build.MODEL
                      val buf = ByteArray(256)
                      while (running) {
                          val p = DatagramPacket(buf, buf.size)
                          s.receive(p)
                          if (String(p.data, 0, p.length) == "CASTSHARE?") {
                              val r = "CASTSHARE!|$name".toByteArray()
                              s.send(DatagramPacket(r, r.size, p.address, p.port))
                          }
                      }
                  } catch (e: Exception) {}
              }

              private fun tcpLoop() {
                  try {
                      val s = ServerSocket()
                      s.reuseAddress = true
                      s.receiveBufferSize = 4 shl 20
                      s.bind(InetSocketAddress(45455))
                      tcp = s
                      while (running) {
                          val c = s.accept()
                          Thread { handle(c) }.start()
                      }
                  } catch (e: Exception) {}
              }

              private fun handle(c: Socket) {
                  try {
                      c.use {
                          val inp = DataInputStream(BufferedInputStream(c.getInputStream(), 1 shl 20))
                          val type = inp.readByte().toInt().toChar()
                          if (type == 'F') receiveFile(inp)
                          else if (type == 'S') Hub.screen(inp, this)
                          else if (type == 'V') {
                              val url = inp.readUTF(); val title = inp.readUTF()
                              val i = Intent(this, PlayerActivity::class.java)
                              i.putExtra("url", url); i.putExtra("title", title)
                              Hub.incoming(this, i, "Video: $title")
                          }
                      }
                  } catch (e: Exception) {}
              }

              private fun receiveFile(inp: DataInputStream) {
                  val name = inp.readUTF(); val size = inp.readLong()
                  val v = ContentValues()
                  v.put(MediaStore.Downloads.DISPLAY_NAME, name)
                  v.put(MediaStore.Downloads.RELATIVE_PATH, "Download/CastShare")
                  val uri = contentResolver.insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, v) ?: return
                  contentResolver.openOutputStream(uri)!!.use { o ->
                      val buf = ByteArray(1 shl 20)
                      var left = size
                      while (left > 0) {
                          val r = inp.read(buf, 0, minOf(buf.size.toLong(), left).toInt())
                          if (r < 0) break
                          o.write(buf, 0, r); left -= r
                      }
                  }
                  val nm = getSystemService(NotificationManager::class.java)
                  nm.notify(name.hashCode(), Notification.Builder(this, "svc").setSmallIcon(android.R.drawable.stat_sys_download_done)
                      .setContentTitle("Received").setContentText("$name saved to Downloads/CastShare").build())
              }
          }

