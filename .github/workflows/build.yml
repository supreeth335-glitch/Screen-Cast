          import com.google.zxing.qrcode.QRCodeWriter
          import java.net.Inet4Address
          import java.net.NetworkInterface
          import java.security.SecureRandom

          /** Browser mode: the other device needs no app. It scans a QR code and uses its web browser. */
          class WebActivity : Activity() {
              private lateinit var status: TextView
              private lateinit var box: LinearLayout
              private val ui = Handler(Looper.getMainLooper())
              private var hot = false

              private fun dp(v: Int) = (v * resources.displayMetrics.density).toInt()
              private fun tv(t: String, size: Float, color: Int): TextView {
                  val v = TextView(this); v.text = t; v.textSize = size; v.setTextColor(color)
                  v.setPadding(0, dp(6), 0, dp(2)); return v
              }
              private fun btn(t: String, color: Int, f: () -> Unit): Button {
                  val b = Button(this); b.text = t; b.isAllCaps = false; b.setTextColor(Color.WHITE); b.textSize = 16f
                  val g = GradientDrawable(); g.setColor(color); g.cornerRadius = dp(16).toFloat(); b.background = g
                  val p = LinearLayout.LayoutParams(-1, -2); p.topMargin = dp(10); b.layoutParams = p
                  b.setOnClickListener { f() }; return b
              }

              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  val need = mutableListOf(Manifest.permission.ACCESS_FINE_LOCATION)
                  if (Build.VERSION.SDK_INT >= 33) need.add("android.permission.NEARBY_WIFI_DEVICES")
                  requestPermissions(need.toTypedArray(), 2)
                  val root = LinearLayout(this)
                  root.orientation = LinearLayout.VERTICAL
                  root.setPadding(dp(18), dp(48), dp(18), dp(24))
                  val muted = 0xFF9AA4C0.toInt()
                  root.addView(tv("Browser mode", 28f, Color.WHITE))
                  root.addView(tv("The other device needs no app. It scans a QR code and opens a web page.", 14f, muted))
                  root.addView(btn("1. Start (uses Wi-Fi, or makes a hotspot)", 0xFF7C3AED.toInt()) { start() })
                  root.addView(btn("2. Add files to share", 0xFF0891B2.toInt()) { pick() })
                  root.addView(btn("3. Share my screen to the browser", 0xFFB45309.toInt()) { cast() })
                  root.addView(btn("Stop everything", 0xFF9F1239.toInt()) { stopAll() })
                  status = tv("Not running", 14f, muted)
                  box = LinearLayout(this); box.orientation = LinearLayout.VERTICAL
                  root.addView(status); root.addView(box)
                  val sc = ScrollView(this)
                  sc.background = GradientDrawable(GradientDrawable.Orientation.TOP_BOTTOM, intArrayOf(0xFF0B1020.toInt(), 0xFF241B4B.toInt()))
                  sc.addView(root)
                  setContentView(sc)
              }

              private fun lanIp(hotspot: Boolean): String? {
                  val found = mutableListOf<Pair<String, String>>()
                  for (ni in NetworkInterface.getNetworkInterfaces()) {
                      if (!ni.isUp || ni.isLoopback) continue
                      for (a in ni.inetAddresses) if (a is Inet4Address && a.isSiteLocalAddress) found.add(Pair(ni.name, a.hostAddress ?: ""))
                  }
                  val ap = found.firstOrNull { it.first.startsWith("ap") || it.first.startsWith("swlan") || (it.first.startsWith("wlan") && it.first != "wlan0") }
                  val wl = found.firstOrNull { it.first.startsWith("wlan") }
                  return (if (hotspot) (ap ?: wl) else (wl ?: ap))?.second
              }

              private fun qr(t: String): Bitmap {
                  val m = QRCodeWriter().encode(t, BarcodeFormat.QR_CODE, 560, 560)
                  val bmp = Bitmap.createBitmap(560, 560, Bitmap.Config.RGB_565)
                  for (x in 0 until 560) for (y in 0 until 560) bmp.setPixel(x, y, if (m.get(x, y)) Color.BLACK else Color.WHITE)
                  return bmp
              }

              private fun addQr(caption: String, text: String) {
                  box.addView(tv(caption, 14f, Color.WHITE))
                  val iv = ImageView(this); iv.setImageBitmap(qr(text)); iv.setPadding(dp(8), dp(8), dp(8), dp(8))
                  iv.setBackgroundColor(Color.WHITE)
                  box.addView(iv, LinearLayout.LayoutParams(dp(240), dp(240)))
              }

              private fun showLinks(wifiQr: String?) {
                  val ip = lanIp(hot)
                  box.removeAllViews()
                  if (ip == null) { status.text = "Could not find this phone's address. Connect to Wi-Fi and try again."; return }
                  val url = "http://" + ip + ":8080/" + Web.token + "/"
                  status.text = "Running. Open this on the other device:\n$url"
                  if (wifiQr != null) addQr("A. Scan with the other phone's camera to join this phone's Wi-Fi", wifiQr)
                  addQr(if (wifiQr != null) "B. Then scan this to open the page" else "Scan to open the page (same Wi-Fi)", url)
              }

              private fun start() {
                  val chars = "abcdefghjkmnpqrstuvwxyz23456789"
                  val r = SecureRandom()
                  Web.token = String(CharArray(8) { chars[r.nextInt(chars.length)] })
                  startForegroundService(Intent(this, WebService::class.java))
                  val cm = getSystemService(ConnectivityManager::class.java)
                  val wifi = cm.getNetworkCapabilities(cm.activeNetwork)?.hasTransport(NetworkCapabilities.TRANSPORT_WIFI) == true
                  if (wifi) { hot = false; showLinks(null) } else startHotspot()
              }

              private fun startHotspot() {
                  status.text = "Starting a private hotspot..."
                  val wm = applicationContext.getSystemService(WIFI_SERVICE) as WifiManager
                  try {
                      wm.startLocalOnlyHotspot(object : WifiManager.LocalOnlyHotspotCallback() {
                          override fun onStarted(res: WifiManager.LocalOnlyHotspotReservation) {
                              Web.hotspot = res
                              var ssid = ""; var pass = ""
                              if (Build.VERSION.SDK_INT >= 30) {
                                  val c = res.softApConfiguration
                                  ssid = c.ssid ?: ""; pass = c.passphrase ?: ""
                              } else {
                                  val c = res.wifiConfiguration
                                  ssid = (c?.SSID ?: "").trim('"'); pass = c?.preSharedKey ?: ""
                              }
                              hot = true
                              ui.postDelayed({ showLinks("WIFI:T:WPA;S:$ssid;P:$pass;;") }, 1500)
                          }
                          override fun onFailed(reason: Int) {
                              ui.post { status.text = "Hotspot failed ($reason). Turn on Location and Wi-Fi, or join the same Wi-Fi on both devices." }
                          }
                      }, ui)
                  } catch (e: Exception) { status.text = "Hotspot failed: " + e.message }
              }

              private fun pick() {
                  val i = Intent(Intent.ACTION_OPEN_DOCUMENT)
                  i.addCategory(Intent.CATEGORY_OPENABLE); i.type = "*/*"
                  i.putExtra(Intent.EXTRA_ALLOW_MULTIPLE, true)
                  startActivityForResult(i, 21)
              }

              private fun cast() {
                  if (Web.token.isEmpty()) { status.text = "Press Start first."; return }
                  startActivityForResult(getSystemService(MediaProjectionManager::class.java).createScreenCaptureIntent(), 22)
              }

              private fun stopAll() {
                  startService(Intent(this, WebService::class.java).setAction("STOP"))
                  startService(Intent(this, CastService::class.java).setAction("STOP"))
                  try { Web.hotspot?.close() } catch (e: Exception) {}
                  Web.hotspot = null; Web.token = ""; Web.files.clear(); Web.frame = null
                  box.removeAllViews(); status.text = "Stopped"
              }

              override fun onActivityResult(req: Int, res: Int, data: Intent?) {
                  super.onActivityResult(req, res, data)
                  if (res != RESULT_OK || data == null) return
                  if (req == 22) {
                      val i = Intent(this, CastService::class.java)
                      i.putExtra("code", res); i.putExtra("data", data); i.putExtra("web", true)
                      startForegroundService(i)
