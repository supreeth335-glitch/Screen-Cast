          cat > 'app/src/main/java/com/example/castshare/WebService.kt' <<'EOF_15'
          package com.example.castshare

          import android.app.*
          import android.content.ContentValues
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.graphics.drawable.Icon
          import android.os.IBinder
          import android.provider.MediaStore
          import java.io.*
          import java.net.*

          /** Tiny web server: any browser on the same Wi-Fi or hotspot can download, play, upload and watch the screen. */
          class WebService : Service() {
              private var srv: ServerSocket? = null
              override fun onBind(i: Intent?): IBinder? = null

              override fun onStartCommand(i: Intent?, f: Int, id: Int): Int {
                  if (i?.action == "STOP") {
                      try { srv?.close() } catch (e: Exception) {}
                      srv = null; stopSelf(); return START_NOT_STICKY
                  }
                  val nm = getSystemService(NotificationManager::class.java)
                  nm.createNotificationChannel(NotificationChannel("web", "Browser mode", NotificationManager.IMPORTANCE_LOW))
                  val stop = PendingIntent.getService(this, 5, Intent(this, WebService::class.java).setAction("STOP"), PendingIntent.FLAG_IMMUTABLE)
                  val act = Notification.Action.Builder(Icon.createWithResource(this, android.R.drawable.ic_media_pause), "Stop", stop).build()
                  startForeground(5, Notification.Builder(this, "web").setSmallIcon(android.R.drawable.ic_menu_share)
                      .setContentTitle("Browser mode is on").addAction(act).build(), ServiceInfo.FOREGROUND_SERVICE_TYPE_DATA_SYNC)
                  if (srv == null) Thread { loop() }.start()
                  return START_NOT_STICKY
              }

              private fun loop() {
                  try {
                      val s = ServerSocket()
                      s.reuseAddress = true
                      s.receiveBufferSize = 4 shl 20
                      s.bind(InetSocketAddress(8080))
                      srv = s
                      while (true) { val c = s.accept(); Thread { handle(c) }.start() }
                  } catch (e: Exception) {}
              }

              private fun line(i: InputStream): String? {
                  val sb = StringBuilder()
                  while (true) {
                      val b = i.read()
                      if (b < 0) return if (sb.isEmpty()) null else sb.toString()
                      if (b == '\n'.code) return sb.toString()
                      if (b != '\r'.code) sb.append(b.toChar())
                  }
              }

              private fun send(out: OutputStream, status: String, type: String, body: ByteArray, extra: String = "") {
                  val h = "HTTP/1.1 $status\r\nContent-Type: $type\r\nContent-Length: ${body.size}\r\nCache-Control: no-store\r\nConnection: close\r\n$extra\r\n"
                  out.write(h.toByteArray()); out.write(body)
              }
              private fun html(out: OutputStream, s: String) = send(out, "200 OK", "text/html; charset=utf-8", s.toByteArray())
              private fun esc(s: String) = s.replace("&", "&amp;").replace("<", "&lt;").replace("'", "&#39;")

              private fun handle(c: Socket) {
                  try {
                      c.use {
                          val ins = BufferedInputStream(c.getInputStream(), 1 shl 16)
                          val out = BufferedOutputStream(c.getOutputStream(), 1 shl 20)
                          val first = line(ins) ?: return
                          val h = HashMap<String, String>()
                          while (true) {
                              val l = line(ins) ?: break
                              if (l.isEmpty()) break
                              val k = l.indexOf(':')
                              if (k > 0) h[l.substring(0, k).lowercase()] = l.substring(k + 1).trim()
                          }
                          val p = first.split(" ")
                          val method = p[0]; val path = p[1].substringBefore('?')
                          val base = "/" + Web.token
                          if (path == base) { send(out, "302 Found", "text/plain", ByteArray(0), "Location: $base/\r\n"); out.flush(); return }
                          if (Web.token.isEmpty() || !path.startsWith("$base/")) {
                              send(out, "403 Forbidden", "text/plain", "Forbidden".toByteArray()); out.flush(); return
                          }
                          val r = path.substring(base.length)
                          if (r == "/") html(out, index())
                          else if (r == "/screen") html(out, SCREEN)
                          else if (r == "/mjpeg") mjpeg(out)
                          else if (r == "/up" && method == "POST") upload(ins, out, h)
                          else if (r.startsWith("/f/") || r.startsWith("/v/"))
                              stream(out, Web.files.getOrNull(r.substring(3).toIntOrNull() ?: -1), h["range"], r.startsWith("/f/"))
                          else if (r.startsWith("/p/")) html(out, playPage(r.substring(3)))
                          else send(out, "404 Not Found", "text/plain", "Not found".toByteArray())
                          out.flush()
                      }
                  } catch (e: Exception) {}
              }

              private fun mjpeg(out: OutputStream) {
                  out.write("HTTP/1.1 200 OK\r\nContent-Type: multipart/x-mixed-replace; boundary=f\r\nCache-Control: no-store\r\nConnection: close\r\n\r\n".toByteArray())
                  var seq = -1; var lastSend = 0L
                  while (true) {
                      val fr = Web.frame
                      val now = System.currentTimeMillis()
                      if (fr != null && (Web.seq != seq || now - lastSend > 1000)) {
                          seq = Web.seq; lastSend = now
                          out.write("--f\r\nContent-Type: image/jpeg\r\nContent-Length: ${fr.size}\r\n\r\n".toByteArray())
                          out.write(fr); out.write("\r\n".toByteArray()); out.flush()
                      } else Thread.sleep(15)
                  }
              }

              private fun upload(ins: InputStream, out: OutputStream, h: Map<String, String>) {
                  val len = h["content-length"]?.toLongOrNull() ?: 0L
                  val name = URLDecoder.decode(h["x-name"] ?: "upload.bin", "UTF-8").replace(Regex("[/\\\\]"), "_")
                  val v = ContentValues()
                  v.put(MediaStore.Downloads.DISPLAY_NAME, name)
                  v.put(MediaStore.Downloads.RELATIVE_PATH, "Download/CastShare")
                  val uri = contentResolver.insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, v) ?: return
                  contentResolver.openOutputStream(uri)!!.use { o ->
                      val buf = ByteArray(1 shl 20)
                      var left = len
                      while (left > 0) {
                          val n = ins.read(buf, 0, minOf(buf.size.toLong(), left).toInt())
                          if (n < 0) break
                          o.write(buf, 0, n); left -= n
                      }
                  }
                  send(out, "200 OK", "text/plain", "ok".toByteArray())
              }

              private fun stream(out: OutputStream, e: Web.Entry?, range: String?, download: Boolean) {
                  if (e == null) { send(out, "404 Not Found", "text/plain", "Not found".toByteArray()); return }
                  val pfd = contentResolver.openFileDescriptor(e.uri, "r") ?: return
                  pfd.use { p ->
                      val size = p.statSize
                      var start = 0L; var end = size - 1
                      if (range != null && range.startsWith("bytes=")) {
                          val x = range.substring(6).split("-")
                          start = x[0].toLongOrNull() ?: 0L
                          if (x.size > 1 && x[1].isNotEmpty()) end = x[1].toLong()
                      }
                      val len = end - start + 1
                      val type = contentResolver.getType(e.uri) ?: "application/octet-stream"
                      val nm = URLEncoder.encode(e.name, "UTF-8").replace("+", "%20")
                      val disp = if (download) "attachment" else "inline"
                      val h = StringBuilder(if (range != null) "HTTP/1.1 206 Partial Content\r\n" else "HTTP/1.1 200 OK\r\n")
                      h.append("Content-Type: $type\r\nAccept-Ranges: bytes\r\nContent-Length: $len\r\n")
                      h.append("Content-Disposition: $disp; filename*=UTF-8''$nm\r\nConnection: close\r\n")
                      if (range != null) h.append("Content-Range: bytes $start-$end/$size\r\n")
                      h.append("\r\n")
                      out.write(h.toString().toByteArray())
                      val ins = FileInputStream(p.fileDescriptor)
                      ins.channel.position(start)
                      val buf = ByteArray(1 shl 20)
                      var left = len
                      while (left > 0) {
                          val n = ins.read(buf, 0, minOf(buf.size.toLong(), left).toInt())
                          if (n < 0) break
                          out.write(buf, 0, n); left -= n
                      }
                  }
              }

              private fun playPage(i: String) = "<!doctype html><meta name=viewport content='width=device-width,initial-scale=1'>" +
                  "<body style='margin:0;background:#000;color:#fff;font-family:sans-serif'>" +
                  "<video controls autoplay playsinline style='width:100%;max-height:92vh;background:#000' src='../v/$i'></video>" +
                  "<p style='padding:0 14px'>Not playing? This browser may not support the video format. " +
                  "<a style='color:#7dd3fc' href='../f/$i'>Download it</a> and open it in VLC.</p></body>"

              private fun index(): String {
                  val sb = StringBuilder("<!doctype html><html><head><meta name=viewport content='width=device-width,initial-scale=1'><title>CastShare</title>")
                  sb.append("<style>body{margin:0;font-family:sans-serif;background:#0b1020;color:#fff;padding:20px}.c{background:#1b2440;border-radius:16px;padding:14px;margin:12px 0}")
                  sb.append("a.b{display:inline-block;background:#7c3aed;color:#fff;padding:10px 16px;border-radius:10px;text-decoration:none;margin:4px 6px 4px 0}a.d{background:#0891b2}small{color:#9aa4c0}</style></head><body>")
                  sb.append("<h1>CastShare</h1><small>Connected to a phone</small>")
                  sb.append("<div class=c><b>Phone screen</b><br><a class=b href='screen'>Watch screen</a></div><div class=c><b>Files from the phone</b><br>")
                  if (Web.files.isEmpty()) sb.append("<small>Nothing shared yet. Refresh this page after files are added.</small>")
                  Web.files.forEachIndexed { i, e ->
                      sb.append("<p>" + esc(e.name) + " <small>" + (e.size / 1048576) + " MB</small><br><a class='b d' href='f/$i'>Download</a><a class=b href='p/$i'>Play</a></p>")
                  }
                  sb.append("</div><div class=c><b>Send files to the phone</b><br><input type=file id=f multiple><br><a class=b href='#' onclick='up();return false'>Send</a>")
                  sb.append("<progress id=p value=0 max=100 style='width:100%'></progress><div id=s></div></div>")
                  sb.append("<script>function up(){var fs=document.getElementById('f').files;var n=0;function nx(){if(n>=fs.length){document.getElementById('s').textContent='Done';return}")
                  sb.append("var f=fs[n];var x=new XMLHttpRequest();x.open('POST','up');x.setRequestHeader('X-Name',encodeURIComponent(f.name));")
                  sb.append("x.upload.onprogress=function(e){document.getElementById('p').value=e.loaded*100/e.total};x.onload=function(){n++;nx()};x.send(f)}nx()}</script></body></html>")
                  return sb.toString()
              }

              private val SCREEN = "<!doctype html><meta name=viewport content='width=device-width,initial-scale=1'><body style='margin:0;background:#000'>" +
                  "<img src='mjpeg' style='width:100vw;height:100vh;object-fit:contain' onclick=\"var s=this.style;s.objectFit=(s.objectFit=='contain'?'cover':(s.objectFit=='cover'?'fill':'contain'))\"></body>"
          }

