          package com.example.castshare

          import android.content.Context
          import android.security.keystore.KeyGenParameterSpec
          import android.security.keystore.KeyProperties
          import java.io.File
          import java.security.KeyStore
          import javax.crypto.Cipher
          import javax.crypto.KeyGenerator
          import javax.crypto.SecretKey
          import javax.crypto.spec.GCMParameterSpec

          /** Encrypted storage (AES-256-GCM, key kept in the Android Keystore and never leaves the secure hardware). */
          object Vault {
              private const val ALIAS = "castshare_vault"

              private fun key(): SecretKey {
                  val ks = KeyStore.getInstance("AndroidKeyStore")
                  ks.load(null)
                  val k = ks.getKey(ALIAS, null)
                  if (k is SecretKey) return k
                  val g = KeyGenerator.getInstance(KeyProperties.KEY_ALGORITHM_AES, "AndroidKeyStore")
                  g.init(KeyGenParameterSpec.Builder(ALIAS, KeyProperties.PURPOSE_ENCRYPT or KeyProperties.PURPOSE_DECRYPT)
                      .setBlockModes(KeyProperties.BLOCK_MODE_GCM)
                      .setEncryptionPaddings(KeyProperties.ENCRYPTION_PADDING_NONE)
                      .setKeySize(256).build())
                  return g.generateKey()
              }

              fun load(ctx: Context, name: String): MutableList<String> {
                  val f = File(ctx.filesDir, "$name.enc")
                  if (!f.exists()) return mutableListOf()
                  return try {
                      val b = f.readBytes()
                      val c = Cipher.getInstance("AES/GCM/NoPadding")
                      c.init(Cipher.DECRYPT_MODE, key(), GCMParameterSpec(128, b.copyOfRange(0, 12)))
                      String(c.doFinal(b, 12, b.size - 12)).split("\n").filter { it.isNotEmpty() }.toMutableList()
                  } catch (e: Exception) { mutableListOf() }
              }

              fun save(ctx: Context, name: String, items: List<String>) {
                  try {
                      val c = Cipher.getInstance("AES/GCM/NoPadding")
                      c.init(Cipher.ENCRYPT_MODE, key())
                      File(ctx.filesDir, "$name.enc").writeBytes(c.iv + c.doFinal(items.joinToString("\n").toByteArray()))
                  } catch (e: Exception) {}
              }
          }

