          package com.example.castshare

          import android.app.*
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.graphics.drawable.Icon
          import android.net.Uri
          import android.os.IBinder
          import java.io.*
          import java.net.*

          /** Serves the chosen video over HTTP with seek support, so the receiver's player pulls the untouched original file. */
          class ServeService : Service() {
              @Volatile private var uri: Uri? = null
              private var srv: ServerSocket? = null

              override fun onBind(i: Intent?): IBinder? = null

              override fun onStartCommand(i: Intent?, f: Int, id: Int): Int {
                  if (i?.action == "STOP") {
                      try { srv?.close() } catch (e: Exception) {}
                      srv = null; stopSelf(); return START_NOT_STICKY
                  }
                  uri = i?.data
                  val nm = getSystemService(NotificationManager::class.java)
                  nm.createNotificationChannel(NotificationChannel("serve", "Video cast", NotificationManager.IMPORTANCE_LOW))
                  val stop = PendingIntent.getService(this, 1, Intent(this, ServeService::class.java).setAction("STOP"), PendingIntent.FLAG_IMMUTABLE)
                  val act = Notification.Action.Builder(Icon.createWithResource(this, android.R.drawable.ic_media_pause), "Stop", stop).build()
                  startForeground(3, Notification.Builder(this, "serve").setSmallIcon(android.R.drawable.ic_media_play)
                      .setContentTitle("Casting a video").addAction(act).build(), ServiceInfo.FOREGROUND_SERVICE_TYPE_DATA_SYNC)
                  if (srv == null) Thread { loop() }.start()
                  return START_NOT_STICKY
              }

              private fun loop() {
                  try {
                      val s = ServerSocket()
                      s.reuseAddress = true
                      s.bind(InetSocketAddress(45456))
                      srv = s
                      while (true) { val c = s.accept(); Thread { serve(c) }.start() }
                  } catch (e: Exception) {}
              }

              private fun serve(c: Socket) {
                  try {
                      c.use {
                          val rd = BufferedReader(InputStreamReader(c.getInputStream()))
                          var range: String? = null
                          while (true) {
                              val l = rd.readLine() ?: break
                              if (l.isEmpty()) break
                              if (l.startsWith("Range:", true)) range = l.substring(6).trim()
                          }
                          val r = range
                          val u = uri ?: return
                          val pfd = contentResolver.openFileDescriptor(u, "r") ?: return
                          pfd.use { p ->
                              val size = p.statSize
                              var start = 0L; var end = size - 1
                              if (r != null && r.startsWith("bytes=")) {
                                  val x = r.substring(6).split("-")
                                  start = x[0].toLongOrNull() ?: 0L
                                  if (x.size > 1 && x[1].isNotEmpty()) end = x[1].toLong()
                              }
                              val len = end - start + 1
                              val type = contentResolver.getType(u) ?: "video/mp4"
                              val h = StringBuilder(if (r != null) "HTTP/1.1 206 Partial Content\r\n" else "HTTP/1.1 200 OK\r\n")
                              h.append("Content-Type: $type\r\nAccept-Ranges: bytes\r\nContent-Length: $len\r\nConnection: close\r\n")
                              if (r != null) h.append("Content-Range: bytes $start-$end/$size\r\n")
                              h.append("\r\n")
                              val out = BufferedOutputStream(c.getOutputStream(), 1 shl 20)
                              out.write(h.toString().toByteArray())
                              val ins = FileInputStream(p.fileDescriptor)
                              ins.channel.position(start)
                              val buf = ByteArray(1 shl 20)
                              var left = len
                              while (left > 0) {
                                  val n = ins.read(buf, 0, minOf(buf.size.toLong(), left).toInt())
                                  if (n < 0) break
                                  out.write(buf, 0, n); left -= n
                              }
                              out.flush()
                          }
                      }
                  } catch (e: Exception) {}
              }
          }

