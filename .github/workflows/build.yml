          private const val API = "https://api.opensubtitles.com/api/v1"

          /** VLC-engine player: nearly every codec, multiple audio tracks, subtitles, scale modes, volume boost, background play. */
          class PlayerActivity : Activity() {
              private lateinit var vlc: LibVLC
              private lateinit var mp: MediaPlayer
              private lateinit var layout: VLCVideoLayout
              private lateinit var ctrl: LinearLayout
              private lateinit var seek: SeekBar
              private lateinit var clock: TextView
              private val ui = Handler(Looper.getMainLooper())
              private var bg = false; private var detached = false; private var drag = false
              private var vol = 100; private var sc = 0; private var title = "video"
              private val scales = arrayOf(MediaPlayer.ScaleType.SURFACE_BEST_FIT, MediaPlayer.ScaleType.SURFACE_FIT_SCREEN,
                  MediaPlayer.ScaleType.SURFACE_FILL, MediaPlayer.ScaleType.SURFACE_16_9, MediaPlayer.ScaleType.SURFACE_4_3,
                  MediaPlayer.ScaleType.SURFACE_ORIGINAL)
              private val scaleNames = arrayOf("Best fit", "Fit screen", "Fill (crop)", "16:9", "4:3", "Original")

              private fun toast(t: String) = Toast.makeText(this, t, Toast.LENGTH_SHORT).show()
              private fun fmt(ms: Long): String { val s = ms / 1000; return "%d:%02d".format(s / 60, s % 60) }
              private fun pick(t: String, names: List<String>, f: (Int) -> Unit) {
                  AlertDialog.Builder(this).setTitle(t).setItems(names.toTypedArray()) { _, i -> f(i) }.show()
              }
              private fun btn(t: String, f: () -> Unit): Button {
                  val b = Button(this); b.text = t; b.isAllCaps = false; b.setTextColor(Color.WHITE)
                  b.setBackgroundColor(0x00000000); b.setOnClickListener { f() }; return b
              }

              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                  val url = intent.getStringExtra("url")
                  if (url == null) { finish(); return }
                  title = intent.getStringExtra("title") ?: "video"
                  vlc = LibVLC(this, arrayListOf("--network-caching=2000", "--file-caching=1500"))
                  mp = MediaPlayer(vlc)
                  layout = VLCVideoLayout(this)
                  val root = FrameLayout(this)
                  root.setBackgroundColor(Color.BLACK)
                  root.addView(layout, FrameLayout.LayoutParams(-1, -1))

                  ctrl = LinearLayout(this)
                  ctrl.orientation = LinearLayout.VERTICAL
                  ctrl.setBackgroundColor(0xAA000000.toInt())
                  ctrl.setPadding(16, 8, 16, 8)
                  val row1 = LinearLayout(this)
                  clock = TextView(this); clock.setTextColor(Color.WHITE); clock.text = "0:00"
                  seek = SeekBar(this); seek.max = 1000
                  row1.addView(btn("Play/Pause") { if (mp.isPlaying) mp.pause() else mp.play() })
                  row1.addView(seek, LinearLayout.LayoutParams(0, -2, 1f))
                  row1.addView(clock)
                  seek.setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                      override fun onProgressChanged(s: SeekBar, p: Int, u: Boolean) {}
                      override fun onStartTrackingTouch(s: SeekBar) { drag = true }
                      override fun onStopTrackingTouch(s: SeekBar) { drag = false; mp.setPosition(s.progress / 1000f) }
                  })
                  val row2 = LinearLayout(this)
                  row2.addView(btn("Scale") {
                      sc = (sc + 1) % scales.size; mp.setVideoScale(scales[sc]); toast(scaleNames[sc])
                  })
                  row2.addView(btn("Audio") {
                      val t = mp.audioTracks
                      if (t == null) toast("No audio tracks") else pick("Audio track", t.map { it.name }) { mp.setAudioTrack(t[it].id) }
                  })
                  row2.addView(btn("Subtitles") { subMenu() })
                  row2.addView(btn("Volume") {
                      vol = if (vol >= 200) 100 else vol + 30; mp.setVolume(vol); toast("Volume $vol%")
                  })
                  row2.addView(btn("Sync -") { mp.setAudioDelay(mp.audioDelay - 100000); toast("Audio earlier 100 ms") })
                  row2.addView(btn("Sync +") { mp.setAudioDelay(mp.audioDelay + 100000); toast("Audio later 100 ms") })
                  row2.addView(btn("Background") { bg = !bg; toast(if (bg) "Background play on" else "Background play off") })
                  val hs = HorizontalScrollView(this)
                  hs.addView(row2)
                  ctrl.addView(row1); ctrl.addView(hs)
                  root.addView(ctrl, FrameLayout.LayoutParams(-1, -2, android.view.Gravity.BOTTOM))
                  layout.setOnClickListener { ctrl.visibility = if (ctrl.visibility == android.view.View.VISIBLE) android.view.View.GONE else android.view.View.VISIBLE }
                  setContentView(root)

                  mp.attachViews(layout, null, true, false)
                  val m = if (url.startsWith("content:"))
                      Media(vlc, contentResolver.openFileDescriptor(Uri.parse(url), "r")!!.fileDescriptor)
                  else Media(vlc, Uri.parse(url))
                  m.setHWDecoderEnabled(true, false)
                  mp.media = m
                  m.release()
                  mp.play()
                  ui.post(object : Runnable {
                      override fun run() {
                          val len = mp.length
                          if (!drag && len > 0) seek.progress = (mp.time * 1000 / len).toInt()
                          clock.text = fmt(mp.time) + " / " + fmt(len)
                          ui.postDelayed(this, 500)
                      }
                  })
              }

              private fun subMenu() {
                  val t = mp.spuTracks ?: emptyArray<MediaPlayer.TrackDescription>()
                  val names = listOf("Off") + t.map { it.name } + listOf("Load .srt file", "Download from OpenSubtitles")
                  pick("Subtitles", names) { i ->
                      if (i == 0) mp.setSpuTrack(-1)
                      else if (i <= t.size) mp.setSpuTrack(t[i - 1].id)
                      else if (i == t.size + 1) {
                          val x = Intent(Intent.ACTION_OPEN_DOCUMENT)
                          x.addCategory(Intent.CATEGORY_OPENABLE); x.type = "*/*"
                          startActivityForResult(x, 7)
                      } else osDialog()
                  }
              }

              override fun onActivityResult(req: Int, res: Int, data: Intent?) {
                  super.onActivityResult(req, res, data)
                  val u = data?.data
                  if (req == 7 && res == RESULT_OK && u != null) {
                      val f = File(cacheDir, "local_sub.srt")
                      contentResolver.openInputStream(u)!!.use { i -> f.outputStream().use { o -> i.copyTo(o) } }
                      mp.addSlave(IMedia.Slave.Type.Subtitle, Uri.fromFile(f), true)
                      toast("Subtitle added")
                  }
              }

              private fun osDialog() {
                  val sp = getSharedPreferences("os", 0)
                  val l = LinearLayout(this)
                  l.orientation = LinearLayout.VERTICAL; l.setPadding(40, 20, 40, 0)
                  fun field(h: String, v: String, pw: Boolean): EditText {
                      val e = EditText(this); e.hint = h; e.setText(v)
                      if (pw) e.inputType = 129
                      l.addView(e); return e
                  }
                  val q = field("Title", title.substringBeforeLast('.').replace(Regex("[._]"), " "), false)
                  val lang = field("Language code (en, hi, es...)", sp.getString("lang", "en") ?: "en", false)
                  val key = field("OpenSubtitles API key", sp.getString("key", "") ?: "", false)
                  val user = field("Username (optional)", sp.getString("user", "") ?: "", false)
                  val pass = field("Password (optional)", sp.getString("pass", "") ?: "", true)
                  AlertDialog.Builder(this).setTitle("OpenSubtitles").setView(l).setPositiveButton("Search & add") { _, _ ->
                      val a = q.text.toString(); val g = lang.text.toString().trim(); val k = key.text.toString().trim()
                      val us = user.text.toString().trim(); val pw = pass.text.toString()
                      sp.edit().putString("lang", g).putString("key", k).putString("user", us).putString("pass", pw).apply()
                      Thread { fetchSub(a, g, k, us, pw) }.start()
                  }.show()
              }

              private fun http(m: String, u: String, key: String, token: String, body: String?): String {
                  val c = URL(u).openConnection() as HttpURLConnection
                  c.requestMethod = m
                  c.setRequestProperty("Api-Key", key); c.setRequestProperty("User-Agent", "CastShare v2.0")
                  c.setRequestProperty("Accept", "application/json")
                  if (token.isNotEmpty()) c.setRequestProperty("Authorization", "Bearer $token")
                  if (body != null) {
                      c.doOutput = true; c.setRequestProperty("Content-Type", "application/json")
                      c.outputStream.use { it.write(body.toByteArray()) }
                  }
                  return c.inputStream.bufferedReader().use { it.readText() }
              }

              private fun fetchSub(q: String, lang: String, key: String, user: String, pass: String) {
                  try {
                      var token = ""
                      if (user.isNotEmpty()) {
                          val body = JSONObject().put("username", user).put("password", pass).toString()
                          token = JSONObject(http("POST", "$API/login", key, "", body)).getString("token")
                      }
                      val url = "$API/subtitles?query=" + URLEncoder.encode(q, "UTF-8") + "&languages=" + lang + "&order_by=download_count"
                      val first = JSONObject(http("GET", url, key, token, null)).getJSONArray("data").getJSONObject(0)
                      val id = first.getJSONObject("attributes").getJSONArray("files").getJSONObject(0).getInt("file_id")
                      val link = JSONObject(http("POST", "$API/download", key, token, JSONObject().put("file_id", id).toString())).getString("link")
                      val f = File(cacheDir, "os_sub.srt")
                      URL(link).openStream().use { i -> f.outputStream().use { o -> i.copyTo(o) } }
                      runOnUiThread { mp.addSlave(IMedia.Slave.Type.Subtitle, Uri.fromFile(f), true); toast("Subtitle added") }
                  } catch (e: Exception) {
                      runOnUiThread { toast("Subtitle failed: " + e.message) }
                  }
              }

              override fun onStop() {
                  super.onStop()
                  if (bg && mp.isPlaying) {
                      mp.detachViews(); detached = true
                      startForegroundService(Intent(this, KeepService::class.java))
                  } else mp.pause()
              }

              override fun onStart() {
                  super.onStart()
                  if (detached) { mp.attachViews(layout, null, true, false); detached = false }
                  stopService(Intent(this, KeepService::class.java))
              }

              override fun onDestroy() {
                  ui.removeCallbacksAndMessages(null)
                  try { mp.stop(); mp.release(); vlc.release() } catch (e: Exception) {}
                  stopService(Intent(this, KeepService::class.java))
                  super.onDestroy()
              }
          }

