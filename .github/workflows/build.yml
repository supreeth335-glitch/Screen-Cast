                  }.show()
              }

              private fun http(m: String, u: String, key: String, token: String, body: String?): String {
                  val c = URL(u).openConnection() as HttpURLConnection
                  c.requestMethod = m
                  c.setRequestProperty("Api-Key", key); c.setRequestProperty("User-Agent", "CastShare v2.0")
                  c.setRequestProperty("Accept", "application/json")
                  if (token.isNotEmpty()) c.setRequestProperty("Authorization", "Bearer $token")
                  if (body != null) {
                      c.doOutput = true; c.setRequestProperty("Content-Type", "application/json")
                      c.outputStream.use { it.write(body.toByteArray()) }
                  }
                  return c.inputStream.bufferedReader().use { it.readText() }
              }

              private fun fetchSub(q: String, lang: String, key: String, user: String, pass: String) {
                  try {
                      var token = ""
                      if (user.isNotEmpty()) {
                          val body = JSONObject().put("username", user).put("password", pass).toString()
                          token = JSONObject(http("POST", "$API/login", key, "", body)).getString("token")
                      }
                      val url = "$API/subtitles?query=" + URLEncoder.encode(q, "UTF-8") + "&languages=" + lang + "&order_by=download_count"
                      val first = JSONObject(http("GET", url, key, token, null)).getJSONArray("data").getJSONObject(0)
                      val id = first.getJSONObject("attributes").getJSONArray("files").getJSONObject(0).getInt("file_id")
                      val link = JSONObject(http("POST", "$API/download", key, token, JSONObject().put("file_id", id).toString())).getString("link")
                      val f = File(cacheDir, "os_sub.srt")
                      URL(link).openStream().use { i -> f.outputStream().use { o -> i.copyTo(o) } }
                      runOnUiThread { mp.addSlave(IMedia.Slave.Type.Subtitle, Uri.fromFile(f), true); toast("Subtitle added") }
                  } catch (e: Exception) {
                      runOnUiThread { toast("Subtitle failed: " + e.message) }
                  }
              }

              override fun onStop() {
                  super.onStop()
                  if (bg && mp.isPlaying) {
                      mp.detachViews(); detached = true
                      startForegroundService(Intent(this, KeepService::class.java))
                  } else mp.pause()
              }

              override fun onStart() {
                  super.onStart()
                  if (detached) { mp.attachViews(layout, null, true, false); detached = false }
                  stopService(Intent(this, KeepService::class.java))
              }

              override fun onDestroy() {
                  ui.removeCallbacksAndMessages(null)
                  try { mp.stop(); mp.release(); vlc.release() } catch (e: Exception) {}
                  stopService(Intent(this, KeepService::class.java))
                  super.onDestroy()
              }
          }

