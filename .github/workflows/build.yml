          data class Peer(val name: String, val host: String)

          class MainActivity : Activity() {
              private var peer: Peer? = null
              private lateinit var info: TextView
              private lateinit var list: LinearLayout
              private lateinit var bar: ProgressBar
              private lateinit var direct: Direct
              private val ui = Handler(Looper.getMainLooper())

              private fun dp(v: Int) = (v * resources.displayMetrics.density).toInt()
              private fun bg(color: Int, r: Int): GradientDrawable {
                  val g = GradientDrawable(); g.setColor(color); g.cornerRadius = dp(r).toFloat(); return g
              }
              private fun lp(top: Int): LinearLayout.LayoutParams {
                  val p = LinearLayout.LayoutParams(-1, -2); p.topMargin = dp(top); return p
              }
              private fun tv(t: String, size: Float, color: Int, bold: Boolean): TextView {
                  val v = TextView(this); v.text = t; v.textSize = size; v.setTextColor(color)
                  if (bold) v.setTypeface(null, android.graphics.Typeface.BOLD)
                  v.layoutParams = lp(4); return v
              }
              private fun btn(t: String, color: Int, f: () -> Unit): Button {
                  val b = Button(this); b.text = t; b.isAllCaps = false; b.setTextColor(Color.WHITE); b.textSize = 16f
                  b.background = bg(color, 16); b.layoutParams = lp(10); b.setOnClickListener { f() }; return b
              }
              private fun card(): LinearLayout {
                  val c = LinearLayout(this); c.orientation = LinearLayout.VERTICAL
                  c.background = bg(0xFF1B2440.toInt(), 24); c.setPadding(dp(20), dp(16), dp(20), dp(18))
                  c.layoutParams = lp(16); return c
              }

              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  val need = mutableListOf(Manifest.permission.ACCESS_FINE_LOCATION)
                  if (Build.VERSION.SDK_INT >= 33) { need.add(Manifest.permission.POST_NOTIFICATIONS); need.add("android.permission.NEARBY_WIFI_DEVICES") }
                  requestPermissions(need.toTypedArray(), 1)
                  direct = Direct(this, { showDirect(it) }, { ip -> peer = Peer("Fast link", ip); Shared.peer = peer; ui.post { info.text = "Fast link ready. Cast or send now." } })
                  direct.start()
                  val muted = 0xFF9AA4C0.toInt()
                  val root = LinearLayout(this)
                  root.orientation = LinearLayout.VERTICAL
                  root.setPadding(dp(18), dp(48), dp(18), dp(24))
                  root.addView(tv("CastShare", 32f, Color.WHITE, true))
                  root.addView(tv("Mirror up to 4K and send files at full Wi-Fi speed", 14f, muted, false))

                  val c1 = card()
                  c1.addView(tv("Receive", 18f, Color.WHITE, true))
                  val status = tv("Off", 13f, muted, false)
                  val sw = Switch(this)
                  sw.text = "Receive mode"; sw.setTextColor(Color.WHITE)
                  sw.setOnCheckedChangeListener { _, on ->
                      val i = Intent(this, ReceiverService::class.java)
                      if (on) startForegroundService(i) else startService(i.setAction("STOP"))
                      status.text = if (on) "Ready. Other phones can find this device." else "Off"
                      if (on) direct.host() else direct.stopHost()
                  }
                  c1.addView(sw); c1.addView(status); root.addView(c1)

                  val c2 = card()
                  c2.addView(tv("Nearby devices", 18f, Color.WHITE, true))
                  list = LinearLayout(this); list.orientation = LinearLayout.VERTICAL
                  c2.addView(btn("Scan", 0xFF2F3B66.toInt()) { scan() })
                  c2.addView(btn("Fast link (Wi-Fi Direct)", 0xFF0E7490.toInt()) { info.text = "Searching nearby phones..."; direct.discover() })
                  c2.addView(list)
                  info = tv("Both phones need CastShare and the same Wi-Fi or hotspot.", 13f, muted, false)
                  c2.addView(info); root.addView(c2)

                  val c3 = card()
                  c3.addView(tv("Share", 18f, Color.WHITE, true))
                  c3.addView(btn("Cast my screen", 0xFF7C3AED.toInt()) { castScreen() })
                  c3.addView(btn("Send files", 0xFF0891B2.toInt()) { pickFiles() })
                  c3.addView(btn("Cast a video (VLC player)", 0xFFB45309.toInt()) { pickVideo(102) })
                  c3.addView(btn("Play a video here", 0xFF15803D.toInt()) { pickVideo(103) })
                  bar = ProgressBar(this, null, android.R.attr.progressBarStyleHorizontal)
                  bar.max = 100; bar.layoutParams = lp(12); c3.addView(bar)
                  c3.addView(btn("Audio output (Bluetooth)", 0xFF2F3B66.toInt()) {
                      startActivity(Intent(Settings.ACTION_BLUETOOTH_SETTINGS))
                  })
                  c3.addView(btn("Browser mode (no app on the other device)", 0xFF9333EA.toInt()) { startActivity(Intent(this, WebActivity::class.java)) })
                  c3.addView(btn("Private browser", 0xFF16A34A.toInt()) { startActivity(Intent(this, BrowserActivity::class.java)) })
                  root.addView(c3)

                  val sc = ScrollView(this)
                  sc.background = GradientDrawable(GradientDrawable.Orientation.TOP_BOTTOM, intArrayOf(0xFF0B1020.toInt(), 0xFF241B4B.toInt()))
                  sc.addView(root)
                  setContentView(sc)
              }

              override fun onResume() {
                  super.onResume()
                  Hub.onIncoming = { i -> ui.post { startActivity(i) } }
              }

              override fun onPause() { Hub.onIncoming = null; super.onPause() }
              override fun onDestroy() { direct.stop(); super.onDestroy() }

              private fun scan() {
                  info.text = "Scanning..."
                  Thread {
                      val found = mutableMapOf<String, Peer>()
                      try {
                          val s = DatagramSocket()
                          s.broadcast = true; s.soTimeout = 400
                          val msg = "CASTSHARE?".toByteArray()
                          repeat(2) { s.send(DatagramPacket(msg, msg.size, InetAddress.getByName("255.255.255.255"), 45454)) }
                          val end = System.currentTimeMillis() + 2500
                          val buf = ByteArray(256)
                          while (System.currentTimeMillis() < end) {
                              try {
                                  val p = DatagramPacket(buf, buf.size)
                                  s.receive(p)
                                  val parts = String(p.data, 0, p.length).split("|")
                                  val ip = p.address.hostAddress
                                  if (parts.size >= 2 && parts[0] == "CASTSHARE!" && ip != null) found[ip] = Peer(parts[1], ip)
                              } catch (e: SocketTimeoutException) {}
                          }
                          s.close()
                      } catch (e: Exception) {}
                      ui.post { showPeers(found.values.toList()) }
                  }.start()
              }

              private fun showPeers(peers: List<Peer>) {
                  list.removeAllViews()
                  if (peers.isEmpty()) {
                      info.text = "No devices found. On the other phone, open CastShare and turn on Receive mode."
                      return
                  }
                  info.text = "Tap a device to select it."
                  for (p in peers) list.addView(btn(p.name, 0xFF3B4A7A.toInt()) { peer = p; Shared.peer = p; info.text = "Selected: ${p.name}" })
              }

              private fun castScreen() {
                  if (peer == null) { info.text = "Scan and select a device first."; return }
                  val mpm = getSystemService(MediaProjectionManager::class.java)
                  startActivityForResult(mpm.createScreenCaptureIntent(), 100)
              }

              private fun pickFiles() {
                  if (peer == null) { info.text = "Scan and select a device first."; return }
                  val i = Intent(Intent.ACTION_OPEN_DOCUMENT)
                  i.addCategory(Intent.CATEGORY_OPENABLE); i.type = "*/*"
                  i.putExtra(Intent.EXTRA_ALLOW_MULTIPLE, true)
                  startActivityForResult(i, 101)
              }

              override fun onActivityResult(req: Int, res: Int, data: Intent?) {
                  super.onActivityResult(req, res, data)
                  if (res != RESULT_OK || data == null) return
                  if (req == 103) {
                      val v = data.data ?: return
                      val i = Intent(this, PlayerActivity::class.java)
                      i.putExtra("url", v.toString()); i.putExtra("title", nameOf(v))
                      startActivity(i); return
                  }
                  val p = peer ?: return
                  if (req == 102) { castVideo(p, data.data ?: return); return }
                  if (req == 100) {
                      val i = Intent(this, CastService::class.java)
                      i.putExtra("code", res); i.putExtra("data", data); i.putExtra("host", p.host)
                      startForegroundService(i)
                      info.text = "Casting to ${p.name}. Use the notification to stop."
                  } else if (req == 101) {
                      val l = mutableListOf<Uri>()
                      val cd = data.clipData
                      if (cd != null) {
                          for (n in 0 until cd.itemCount) l.add(cd.getItemAt(n).uri)
                      } else {
                          data.data?.let { l.add(it) }
                      }
                      sendFiles(p, l)
                  }
              }

              private fun showDirect(ds: List<android.net.wifi.p2p.WifiP2pDevice>) {
                  list.removeAllViews()
                  for (d in ds) list.addView(btn("Fast: " + d.deviceName, 0xFF155E75.toInt()) {
                      direct.connect(d); info.text = "Connecting to ${d.deviceName}. Accept the prompt on that phone."
                  })
              }

              private fun pickVideo(code: Int) {
                  val i = Intent(Intent.ACTION_OPEN_DOCUMENT)
                  i.addCategory(Intent.CATEGORY_OPENABLE); i.type = "video/*"
                  startActivityForResult(i, code)
              }

              private fun nameOf(u: Uri): String {
                  var n = "video"
                  val c = contentResolver.query(u, null, null, null, null)
                  if (c != null) {
                      if (c.moveToFirst()) { val a = c.getColumnIndex(OpenableColumns.DISPLAY_NAME); if (a >= 0) n = c.getString(a) }
                      c.close()
                  }
                  return n
              }

              private fun castVideo(p: Peer, u: Uri) {
                  startForegroundService(Intent(this, ServeService::class.java).setData(u).addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION))
                  val name = nameOf(u)
                  Thread {
                      try {
                          val s = Socket()
                          s.connect(InetSocketAddress(p.host, 45455), 5000)
                          val out = DataOutputStream(s.getOutputStream())
                          out.writeByte('V'.code)
                          out.writeUTF("http://" + s.localAddress.hostAddress + ":45456/v")
                          out.writeUTF(name); out.flush(); s.close()
                          ui.post { info.text = "Playing on ${p.name}. Keep this phone on Wi-Fi." }
                      } catch (e: Exception) { ui.post { info.text = "Failed: ${e.message}" } }
                  }.start()
              }

              private fun sendFiles(p: Peer, uris: List<Uri>) {
                  Thread {
                      try {
                          for ((n, u) in uris.withIndex()) {
                              var name = "file"; var size = 0L
                              val c = contentResolver.query(u, null, null, null, null)
                              if (c != null) {
                                  if (c.moveToFirst()) {
                                      val a = c.getColumnIndex(OpenableColumns.DISPLAY_NAME)
                                      val z = c.getColumnIndex(OpenableColumns.SIZE)
                                      if (a >= 0) name = c.getString(a)
                                      if (z >= 0) size = c.getLong(z)
                                  }
                                  c.close()
                              }
                              val s = Socket()
                              s.sendBufferSize = 4 shl 20
                              s.connect(InetSocketAddress(p.host, 45455), 5000)
                              val out = DataOutputStream(BufferedOutputStream(s.getOutputStream(), 1 shl 20))
                              out.writeByte('F'.code); out.writeUTF(name); out.writeLong(size)
                              val buf = ByteArray(1 shl 20)
                              var sent = 0L; var last = 0L
                              val ins = contentResolver.openInputStream(u)!!
                              while (true) {
                                  val r = ins.read(buf)
                                  if (r < 0) break
                                  out.write(buf, 0, r); sent += r
                                  val now = System.currentTimeMillis()
                                  if (now - last > 300) {
                                      last = now
                                      val pct = if (size > 0) (sent * 100 / size).toInt() else 0
                                      ui.post { bar.progress = pct; info.text = "Sending ${n + 1}/${uris.size}: $name $pct%" }
                                  }
                              }
                              ins.close(); out.flush(); s.close()
                          }
                          ui.post { bar.progress = 100; info.text = "Sent ${uris.size} file(s)" }
                      } catch (e: Exception) {
                          ui.post { info.text = "Failed: ${e.message}" }
                      }
                  }.start()
              }
          }

