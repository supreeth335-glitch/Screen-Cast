name: Build APK
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Write project and build
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_NO: ${{ github.run_number }}
          REPO: ${{ github.repository }}
        run: |
          mkdir proj && cd proj
          mkdir -p $(dirname 'app/build.gradle.kts')
          cat > 'app/build.gradle.kts' <<'EOF_0'
          plugins { id("com.android.application"); id("org.jetbrains.kotlin.android") }
          android {
              namespace = "com.example.castshare"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.example.castshare"; minSdk = 29; targetSdk = 34; versionCode = 2; versionName = "2.0"
                  ndk { abiFilters += listOf("arm64-v8a") }
              }
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation("org.videolan.android:libvlc-all:3.6.0")
              implementation("com.google.zxing:core:3.5.3")
          }

          EOF_0
          mkdir -p $(dirname 'app/src/main/AndroidManifest.xml')
          cat > 'app/src/main/AndroidManifest.xml' <<'EOF_1'
