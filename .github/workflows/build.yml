                      val uris = mutableListOf<Uri>()
                      val cd = data.clipData
                      if (cd != null) { for (n in 0 until cd.itemCount) uris.add(cd.getItemAt(n).uri) } else data.data?.let { uris.add(it) }
                      for (u in uris) {
                          var name = "file"; var size = 0L
                          val c = contentResolver.query(u, null, null, null, null)
                          if (c != null) {
                              if (c.moveToFirst()) {
                                  val a = c.getColumnIndex(OpenableColumns.DISPLAY_NAME); val z = c.getColumnIndex(OpenableColumns.SIZE)
                                  if (a >= 0) name = c.getString(a)
                                  if (z >= 0) size = c.getLong(z)
