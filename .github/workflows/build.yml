          package com.example.castshare

          import android.app.*
          import android.content.Context
          import android.content.Intent
          import android.media.MediaCodec
          import android.media.MediaFormat
          import android.view.Surface
          import java.io.DataInputStream

          /** Receiver side: hands incoming screens and videos to the UI, and decodes the screen stream. */
          object Hub {
              @Volatile var surface: Surface? = null
              @Volatile var onIncoming: ((Intent) -> Unit)? = null
              @Volatile var onEnd: (() -> Unit)? = null
              @Volatile var onSize: ((Int, Int) -> Unit)? = null

              fun incoming(ctx: Context, i: Intent, text: String) {
                  i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                  val cb = onIncoming
                  if (cb != null) { cb(i); return }
                  val nm = ctx.getSystemService(NotificationManager::class.java)
                  nm.createNotificationChannel(NotificationChannel("alerts", "Incoming", NotificationManager.IMPORTANCE_HIGH))
                  val pi = PendingIntent.getActivity(ctx, 0, i, PendingIntent.FLAG_IMMUTABLE)
                  nm.notify(9, Notification.Builder(ctx, "alerts").setSmallIcon(android.R.drawable.ic_menu_view)
                      .setContentTitle(text).setContentText("Tap to open").setContentIntent(pi).setAutoCancel(true).build())
              }

              fun screen(inp: DataInputStream, ctx: Context) {
                  val w = inp.readInt(); val h = inp.readInt(); val mime = inp.readUTF()
                  incoming(ctx, Intent(ctx, ViewerActivity::class.java), "Screen incoming")
                  var t = 0
                  while (surface == null && t < 600) { Thread.sleep(100); t++ }
                  val s = surface ?: return
                  onSize?.invoke(w, h)
                  val codec = MediaCodec.createDecoderByType(mime)
                  codec.configure(MediaFormat.createVideoFormat(mime, w, h), s, null, 0)
                  codec.start()
                  val info = MediaCodec.BufferInfo()
                  try {
                      while (surface != null) {
                          val len = inp.readInt(); val pts = inp.readLong(); val flags = inp.readInt()
                          val d = ByteArray(len); inp.readFully(d)
                          var i = codec.dequeueInputBuffer(100000)
                          while (i < 0 && surface != null) i = codec.dequeueInputBuffer(100000)
                          if (i < 0) break
                          val ib = codec.getInputBuffer(i)!!
                          ib.clear(); ib.put(d)
                          codec.queueInputBuffer(i, 0, len, pts, flags)
                          while (true) {
                              val o = codec.dequeueOutputBuffer(info, 0)
                              if (o >= 0) codec.releaseOutputBuffer(o, true) else break
                          }
                      }
                  } catch (e: Exception) {
                  } finally {
                      try { codec.stop() } catch (e: Exception) {}
                      codec.release()
                      onEnd?.invoke()
                  }
              }
          }

