          package com.example.castshare

          import android.app.Activity
          import android.os.Bundle
          import android.view.*
          import android.widget.FrameLayout
          import android.widget.Toast

          /** Shows the incoming screen. Tap anywhere to switch scale: Fit, Fill (crop), Stretch. */
          class ViewerActivity : Activity() {
              private var vw = 16; private var vh = 9; private var mode = 0
              private lateinit var root: FrameLayout
              private lateinit var sv: SurfaceView

              private fun apply() {
                  if (root.width == 0) return
                  val fit = minOf(root.width / vw.toFloat(), root.height / vh.toFloat())
                  val fill = maxOf(root.width / vw.toFloat(), root.height / vh.toFloat())
                  val p = when (mode) {
                      0 -> FrameLayout.LayoutParams((vw * fit).toInt(), (vh * fit).toInt(), Gravity.CENTER)
                      1 -> FrameLayout.LayoutParams((vw * fill).toInt(), (vh * fill).toInt(), Gravity.CENTER)
                      else -> FrameLayout.LayoutParams(-1, -1, Gravity.CENTER)
                  }
                  sv.layoutParams = p
              }

              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                  root = FrameLayout(this)
                  root.setBackgroundColor(0xFF000000.toInt())
                  sv = SurfaceView(this)
                  root.addView(sv, FrameLayout.LayoutParams(-1, -1, Gravity.CENTER))
                  setContentView(root)
                  sv.holder.addCallback(object : SurfaceHolder.Callback {
                      override fun surfaceCreated(h: SurfaceHolder) { Hub.surface = h.surface }
                      override fun surfaceChanged(h: SurfaceHolder, f: Int, w: Int, ht: Int) {}
                      override fun surfaceDestroyed(h: SurfaceHolder) { Hub.surface = null }
                  })
                  root.setOnClickListener {
                      mode = (mode + 1) % 3
                      apply()
                      Toast.makeText(this, arrayOf("Fit", "Fill (crop)", "Stretch")[mode], Toast.LENGTH_SHORT).show()
                  }
                  root.addOnLayoutChangeListener { _, _, _, _, _, _, _, _, _ -> }
                  Hub.onSize = { w, h -> runOnUiThread { vw = w; vh = h; apply() } }
                  Hub.onEnd = { runOnUiThread { finish() } }
              }

              override fun onDestroy() { Hub.onSize = null; Hub.onEnd = null; super.onDestroy() }
          }

