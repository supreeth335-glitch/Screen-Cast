          package com.example.castshare

          import android.app.Activity
          import android.app.AlertDialog
          import android.app.DownloadManager
          import android.content.Intent
          import android.graphics.Color
          import android.media.projection.MediaProjectionManager
          import android.net.Uri
          import android.os.Bundle
          import android.os.Environment
          import android.view.View
          import android.view.inputmethod.EditorInfo
          import android.webkit.*
          import android.widget.*
          import java.io.ByteArrayInputStream
          import java.io.DataOutputStream
          import java.net.InetSocketAddress
          import java.net.Socket
          import java.net.URLEncoder

          /** Private browser: no accounts, no analytics, HTTPS-only, tracker blocking, encrypted history and bookmarks. */
          class BrowserActivity : Activity() {
              private lateinit var wv: WebView
              private lateinit var addr: EditText
              private lateinit var bar: ProgressBar
              private lateinit var castV: Button
              private lateinit var privB: Button
              private lateinit var shB: Button
              private var priv = false; private var block = true; private var blocked = 0
              private var media: String? = null; private var pageTitle = ""
              private val ads = listOf("doubleclick.net", "googlesyndication.com", "google-analytics.com", "googletagmanager.com",
                  "googletagservices.com", "adservice.google.com", "facebook.net", "connect.facebook.net", "scorecardresearch.com",
                  "taboola.com", "outbrain.com", "criteo.com", "criteo.net", "adnxs.com", "hotjar.com", "mixpanel.com", "segment.io",
                  "amplitude.com", "mc.yandex.ru", "adsrvr.org", "rubiconproject.com", "pubmatic.com", "openx.net", "quantserve.com",
                  "chartbeat.com", "newrelic.com", "moatads.com", "bat.bing.com", "ads.twitter.com", "analytics.tiktok.com", "app-measurement.com")

              private fun toast(t: String) = Toast.makeText(this, t, Toast.LENGTH_SHORT).show()
              private fun clean(s: String) = s.replace('\n', ' ').replace('\t', ' ')

              private fun go(t: String) {
                  val s = t.trim()
                  val u = if (s.startsWith("https://")) s
                  else if (s.startsWith("http://")) "https://" + s.removePrefix("http://")
                  else if (s.contains(' ') || !s.contains('.')) "https://duckduckgo.com/?q=" + URLEncoder.encode(s, "UTF-8")
                  else "https://$s"
                  wv.loadUrl(u, mapOf("DNT" to "1", "Sec-GPC" to "1"))
              }

              private fun tb(label: String, f: () -> Unit): Button {
                  val b = Button(this); b.text = label; b.isAllCaps = false; b.setTextColor(Color.WHITE)
                  b.setBackgroundColor(0x00000000); b.setOnClickListener { f() }; return b
              }

              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  val root = LinearLayout(this)
                  root.orientation = LinearLayout.VERTICAL
                  root.setBackgroundColor(0xFF0B1020.toInt())
                  addr = EditText(this)
                  addr.setSingleLine(); addr.setTextColor(Color.WHITE); addr.setHintTextColor(0xFF9AA4C0.toInt())
                  addr.hint = "Search or type a web address"; addr.imeOptions = EditorInfo.IME_ACTION_GO
                  addr.setPadding(24, 56, 24, 16)
                  addr.setOnEditorActionListener { _, _, _ -> go(addr.text.toString()); true }
                  bar = ProgressBar(this, null, android.R.attr.progressBarStyleHorizontal)
                  bar.max = 100
                  wv = WebView(this)
                  root.addView(addr); root.addView(bar, LinearLayout.LayoutParams(-1, 8))
                  root.addView(wv, LinearLayout.LayoutParams(-1, 0, 1f))

                  val row = LinearLayout(this)
                  row.addView(tb("Back") { if (wv.canGoBack()) wv.goBack() })
                  row.addView(tb("Forward") { if (wv.canGoForward()) wv.goForward() })
                  row.addView(tb("Reload") { wv.reload() })
                  row.addView(tb("Save") { saveBookmark() })
                  row.addView(tb("Bookmarks") { showList("Bookmarks", "bm") })
                  row.addView(tb("History") { showList("History", "hist") })
                  privB = tb("Private: off") { priv = !priv; privB.text = if (priv) "Private: ON" else "Private: off" }
                  row.addView(privB)
                  shB = tb("Shields: ON") { block = !block; shB.text = if (block) "Shields: ON" else "Shields: off" }
                  row.addView(shB)
                  castV = tb("Cast video") { castVideo() }
                  row.addView(castV)
                  row.addView(tb("Cast screen") { castScreen() })
                  row.addView(tb("Clear data") { wipe(); toast("Cleared") })
                  val hs = HorizontalScrollView(this)
                  hs.addView(row)
                  root.addView(hs)
                  setContentView(root)
                  setup()
                  go(intent.getStringExtra("url") ?: "duckduckgo.com")
              }

              private fun setup() {
                  val s = wv.settings
                  s.javaScriptEnabled = true
                  s.domStorageEnabled = true
                  s.allowFileAccess = false
                  s.allowContentAccess = false
                  s.setGeolocationEnabled(false)
                  s.mixedContentMode = WebSettings.MIXED_CONTENT_NEVER_ALLOW
                  s.safeBrowsingEnabled = true
                  s.javaScriptCanOpenWindowsAutomatically = false
                  s.setSupportMultipleWindows(false)
                  CookieManager.getInstance().setAcceptThirdPartyCookies(wv, false)
                  wv.setDownloadListener { url, ua, cd, mime, _ ->
                      try {
                          val r = DownloadManager.Request(Uri.parse(url))
                          r.setMimeType(mime)
                          r.addRequestHeader("User-Agent", ua)
                          r.addRequestHeader("Cookie", CookieManager.getInstance().getCookie(url) ?: "")
                          r.setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED)
                          r.setDestinationInExternalPublicDir(Environment.DIRECTORY_DOWNLOADS, URLUtil.guessFileName(url, cd, mime))
                          getSystemService(DownloadManager::class.java).enqueue(r)
                          toast("Downloading...")
                      } catch (e: Exception) { toast("Download failed") }
                  }
                  wv.webChromeClient = object : WebChromeClient() {
                      override fun onProgressChanged(v: WebView, p: Int) { bar.progress = p; bar.visibility = if (p < 100) View.VISIBLE else View.GONE }
                      override fun onReceivedTitle(v: WebView, t: String) { pageTitle = t }
                      override fun onGeolocationPermissionsShowPrompt(o: String, cb: GeolocationPermissions.Callback) { cb.invoke(o, false, false) }
                      override fun onPermissionRequest(r: PermissionRequest) { r.deny() }
                  }
                  wv.webViewClient = object : WebViewClient() {
                      override fun shouldOverrideUrlLoading(v: WebView, r: WebResourceRequest): Boolean {
                          val u = r.url
                          if (u.scheme == "http") { v.loadUrl(u.toString().replaceFirst("http://", "https://")); return true }
                          return u.scheme != "https"
                      }
                      override fun shouldInterceptRequest(v: WebView, r: WebResourceRequest): WebResourceResponse? {
                          val h = r.url.host ?: ""
                          val p = r.url.path?.lowercase() ?: ""
                          if (listOf(".mp4", ".webm", ".m3u8", ".mpd", ".mkv", ".mov").any { p.endsWith(it) }) {
                              media = r.url.toString()
                              runOnUiThread { castV.text = "Cast video *" }
                          }
                          if (block && ads.any { h == it || h.endsWith(".$it") }) {
                              blocked++
                              runOnUiThread { shB.text = "Shields: $blocked blocked" }
                              return WebResourceResponse("text/plain", "utf-8", ByteArrayInputStream(ByteArray(0)))
                          }
                          return null
                      }
                      override fun onPageStarted(v: WebView, url: String, f: android.graphics.Bitmap?) {
                          blocked = 0; media = null; addr.setText(url); castV.text = "Cast video"
                          if (block) shB.text = "Shields: ON"
                      }
                      override fun onPageFinished(v: WebView, url: String) {
                          if (priv) return
                          val l = Vault.load(this@BrowserActivity, "hist")
                          val e = clean(pageTitle) + "\t" + url
                          if (l.firstOrNull() != e) { l.add(0, e); Vault.save(this@BrowserActivity, "hist", l.take(500)) }
                      }
                  }
              }

              private fun saveBookmark() {
                  val l = Vault.load(this, "bm")
                  l.add(0, clean(pageTitle) + "\t" + (wv.url ?: ""))
                  Vault.save(this, "bm", l); toast("Saved (encrypted)")
              }

              private fun showList(title: String, name: String) {
                  val l = Vault.load(this, name)
                  val names = l.take(100).map { it.substringBefore('\t').ifEmpty { it.substringAfter('\t') } } + listOf("Clear all")
                  AlertDialog.Builder(this).setTitle(title).setItems(names.toTypedArray()) { _, i ->
                      if (i >= l.take(100).size) { Vault.save(this, name, emptyList()); toast("Cleared") }
                      else go(l[i].substringAfter('\t'))
                  }.show()
              }

              private fun wipe() {
                  wv.clearCache(true); wv.clearHistory()
                  CookieManager.getInstance().removeAllCookies(null)
                  WebStorage.getInstance().deleteAllData()
              }

              private fun castVideo() {
                  val m = media; val p = Shared.peer
                  if (m == null) { toast("No direct video found here. Try Cast screen."); return }
                  if (p == null) { toast("Pick a device on the main screen first."); return }
                  val t = clean(pageTitle)
                  Thread {
                      try {
                          val s = Socket()
                          s.connect(InetSocketAddress(p.host, 45455), 5000)
                          val out = DataOutputStream(s.getOutputStream())
                          out.writeByte('V'.code); out.writeUTF(m); out.writeUTF(t); out.flush(); s.close()
                          runOnUiThread { toast("Playing on ${p.name}") }
                      } catch (e: Exception) { runOnUiThread { toast("Cast failed") } }
                  }.start()
              }

              private fun castScreen() {
                  if (Shared.peer == null) { toast("Pick a device on the main screen first."); return }
                  startActivityForResult(getSystemService(MediaProjectionManager::class.java).createScreenCaptureIntent(), 31)
              }

              override fun onActivityResult(req: Int, res: Int, data: Intent?) {
                  super.onActivityResult(req, res, data)
                  val p = Shared.peer
                  if (req == 31 && res == RESULT_OK && data != null && p != null) {
                      val i = Intent(this, CastService::class.java)
                      i.putExtra("code", res); i.putExtra("data", data); i.putExtra("host", p.host)
                      startForegroundService(i)
                      toast("Casting this browser to ${p.name}")
                  }
              }

              @Deprecated("Deprecated in Java")
              override fun onBackPressed() { if (wv.canGoBack()) wv.goBack() else super.onBackPressed() }

              override fun onDestroy() {
                  if (priv) wipe()
                  wv.destroy()
                  super.onDestroy()
              }
          }

          EOF_2
          mkdir -p $(dirname 'app/src/main/java/com/example/castshare/CastService.kt')
          cat > 'app/src/main/java/com/example/castshare/CastService.kt' <<'EOF_3'
          package com.example.castshare

          import android.app.*
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.graphics.drawable.Icon
          import android.hardware.display.DisplayManager
          import android.hardware.display.VirtualDisplay
          import android.media.MediaCodec
          import android.media.MediaCodecInfo
          import android.media.MediaFormat
          import android.media.projection.MediaProjection
          import android.media.projection.MediaProjectionManager
          import android.graphics.Bitmap
          import android.graphics.PixelFormat
          import android.media.ImageReader
          import android.os.Handler
          import android.os.HandlerThread
          import android.os.IBinder
          import android.os.Looper
          import android.view.WindowManager
          import java.io.*
          import java.net.*

          /** Sender side: captures the screen, hardware-encodes it (HEVC/H.264, up to 4K) and streams it. */
          class CastService : Service() {
              @Volatile private var active = false

              override fun onBind(i: Intent?): IBinder? = null

              override fun onStartCommand(i: Intent?, f: Int, id: Int): Int {
                  if (i == null || i.action == "STOP") { active = false; stopSelf(); return START_NOT_STICKY }
                  if (active) return START_NOT_STICKY
                  active = true
                  val nm = getSystemService(NotificationManager::class.java)
                  nm.createNotificationChannel(NotificationChannel("cast", "Casting", NotificationManager.IMPORTANCE_LOW))
                  val stop = PendingIntent.getService(this, 0, Intent(this, CastService::class.java).setAction("STOP"), PendingIntent.FLAG_IMMUTABLE)
                  val act = Notification.Action.Builder(Icon.createWithResource(this, android.R.drawable.ic_media_pause), "Stop", stop).build()
                  val n = Notification.Builder(this, "cast").setSmallIcon(android.R.drawable.ic_menu_share)
                      .setContentTitle("Casting your screen").addAction(act).build()
                  startForeground(2, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PROJECTION)
                  val code = i.getIntExtra("code", 0)
                  val data = i.getParcelableExtra<Intent>("data")
                  val host = i.getStringExtra("host")
                  val web = i.getBooleanExtra("web", false)
                  if (data == null || (host == null && !web)) { stopSelf(); return START_NOT_STICKY }
                  Thread { cast(code, data, host ?: "", web) }.start()
                  return START_NOT_STICKY
              }

              private fun cast(code: Int, data: Intent, host: String, web: Boolean) {
                  var proj: MediaProjection? = null
                  var enc: MediaCodec? = null
                  var vd: VirtualDisplay? = null
                  var sock: Socket? = null
                  try {
                      val mpm = getSystemService(MediaProjectionManager::class.java)
                      val pj = mpm.getMediaProjection(code, data)
                      proj = pj
                      pj.registerCallback(object : MediaProjection.Callback() {
                          override fun onStop() { active = false }
                      }, Handler(Looper.getMainLooper()))
                      if (web) {
                          val dm = resources.displayMetrics
                          val k0 = minOf(1f, 1920f / maxOf(dm.widthPixels, dm.heightPixels))
                          val ww = (dm.widthPixels * k0).toInt() / 2 * 2
                          val hh = (dm.heightPixels * k0).toInt() / 2 * 2
                          val ht = HandlerThread("jpg"); ht.start()
                          val ir = ImageReader.newInstance(ww, hh, PixelFormat.RGBA_8888, 2)
                          var lastT = 0L
                          ir.setOnImageAvailableListener({ r ->
                              val img = r.acquireLatestImage()
                              if (img != null) {
                                  try {
                                      val now = System.currentTimeMillis()
                                      if (now - lastT >= 33) {
                                          lastT = now
                                          val pl = img.planes[0]
                                          val bmp = Bitmap.createBitmap(pl.rowStride / pl.pixelStride, hh, Bitmap.Config.ARGB_8888)
                                          bmp.copyPixelsFromBuffer(pl.buffer)
                                          val bo = ByteArrayOutputStream()
                                          Bitmap.createBitmap(bmp, 0, 0, ww, hh).compress(Bitmap.CompressFormat.JPEG, 70, bo)
                                          Web.frame = bo.toByteArray(); Web.seq++
                                      }
                                  } finally { img.close() }
                              }
                          }, Handler(ht.looper))
                          vd = pj.createVirtualDisplay("web", ww, hh, dm.densityDpi,
                              DisplayManager.VIRTUAL_DISPLAY_FLAG_AUTO_MIRROR, ir.surface, null, null)
                          while (active) Thread.sleep(200)
                          ht.quitSafely()
                          return
                      }

                      val b = getSystemService(WindowManager::class.java).currentWindowMetrics.bounds
                      var w = b.width(); var h = b.height()
                      val big = maxOf(w, h)
                      if (big > 3840) { val s = 3840f / big; w = (w * s).toInt(); h = (h * s).toInt() }
                      w = w / 16 * 16; h = h / 16 * 16
                      val k = 1920f / maxOf(w, h)
                      val tries = listOf(
                          Triple("video/hevc", w, h), Triple("video/avc", w, h),
                          Triple("video/avc", (w * k).toInt() / 16 * 16, (h * k).toInt() / 16 * 16))
                      var mime = ""
                      for ((m, tw, th) in tries) {
                          try {
                              val f = MediaFormat.createVideoFormat(m, tw, th)
                              f.setInteger(MediaFormat.KEY_COLOR_FORMAT, MediaCodecInfo.CodecCapabilities.COLOR_FormatSurface)
                              f.setInteger(MediaFormat.KEY_BIT_RATE, minOf(40_000_000L, tw.toLong() * th * 5).toInt())
                              f.setInteger(MediaFormat.KEY_FRAME_RATE, 60)
                              f.setInteger(MediaFormat.KEY_I_FRAME_INTERVAL, 1)
                              f.setLong(MediaFormat.KEY_REPEAT_PREVIOUS_FRAME_AFTER, 100_000L)
                              val e = MediaCodec.createEncoderByType(m)
                              try { e.configure(f, null, null, MediaCodec.CONFIGURE_FLAG_ENCODE) }
                              catch (x: Exception) { e.release(); throw x }
                              enc = e; mime = m; w = tw; h = th
                              break
                          } catch (x: Exception) {}
                      }
                      val e2 = enc ?: throw Exception("No encoder")
                      val surf = e2.createInputSurface()
                      e2.start()
                      vd = pj.createVirtualDisplay("cast", w, h, resources.displayMetrics.densityDpi,
                          DisplayManager.VIRTUAL_DISPLAY_FLAG_AUTO_MIRROR, surf, null, null)

                      val sk = Socket()
                      sock = sk
                      sk.connect(InetSocketAddress(host, 45455), 5000)
                      val out = DataOutputStream(BufferedOutputStream(sk.getOutputStream(), 1 shl 20))
                      out.writeByte('S'.code); out.writeInt(w); out.writeInt(h); out.writeUTF(mime); out.flush()
                      val info = MediaCodec.BufferInfo()
                      while (active) {
                          val i = e2.dequeueOutputBuffer(info, 100000)
                          if (i >= 0) {
                              val bb = e2.getOutputBuffer(i)!!
                              val arr = ByteArray(info.size)
                              bb.position(info.offset); bb.get(arr)
                              out.writeInt(arr.size); out.writeLong(info.presentationTimeUs); out.writeInt(info.flags)
                              out.write(arr); out.flush()
                              e2.releaseOutputBuffer(i, false)
                          }
                      }
                  } catch (e: Exception) {
                  } finally {
                      try { vd?.release() } catch (e: Exception) {}
                      try { enc?.stop() } catch (e: Exception) {}
                      try { enc?.release() } catch (e: Exception) {}
                      try { proj?.stop() } catch (e: Exception) {}
                      try { sock?.close() } catch (e: Exception) {}
                      active = false
                      stopSelf()
                  }
              }
          }

          EOF_3
