          package com.example.castshare

          import android.app.*
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.os.IBinder

          /** Keeps the process alive while the player runs in the background. */
          class KeepService : Service() {
              override fun onBind(i: Intent?): IBinder? = null
              override fun onStartCommand(i: Intent?, f: Int, id: Int): Int {
                  val nm = getSystemService(NotificationManager::class.java)
                  nm.createNotificationChannel(NotificationChannel("keep", "Playback", NotificationManager.IMPORTANCE_LOW))
                  startForeground(4, Notification.Builder(this, "keep").setSmallIcon(android.R.drawable.ic_media_play)
                      .setContentTitle("CastShare is playing").build(), ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PLAYBACK)
                  return START_NOT_STICKY
              }
          }

